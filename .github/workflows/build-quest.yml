name: Build QuakeQuest APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build APK using Team Beef OVR SDK Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/proj brainslugs83/ovrsdk /opt/build.sh

      - name: Locate and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuakeQuest-VR-APK
          path: |
            *.apk
            Projects/Android/**/*.apk
            Projects/Android/build/outputs/apk/**/*.apk
