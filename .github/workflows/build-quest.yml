name: Build Meta Quest APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-29"

      - name: Make Gradlew Executable
        run: |
          if [ -f "Projects/Android/gradlew" ]; then
            chmod +x Projects/Android/gradlew
          elif [ -f "gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        working-directory: Projects/Android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuakeQuest-Standalone-VR
          path: |
            Projects/Android/build/outputs/apk/**/*.apk
            Projects/Android/app/build/outputs/apk/**/*.apk
