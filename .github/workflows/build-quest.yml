name: Build Meta Quest APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle 7.4.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.4.2'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & SDK Components
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-29" "build-tools;30.0.3"

      - name: Generate Compatible Gradle Wrapper
        working-directory: Projects/Android
        run: |
          gradle wrapper --gradle-version 7.4.2
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: Projects/Android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuakeQuest-Standalone-VR
          path: |
            Projects/Android/build/outputs/apk/**/*.apk
            Projects/Android/app/build/outputs/apk/**/*.apk
